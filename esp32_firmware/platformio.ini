; PlatformIO Project Configuration for Waveshare ESP32-C6-LCD-1.47
; Pedometer Simulator with BLE Android Sync

[platformio]
default_envs = esp32-c6-lcd-147
src_dir = src

[env:esp32-c6-lcd-147]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; Serial & Monitor settings
upload_port = COM13
monitor_port = COM13
monitor_speed = 115200
upload_speed = 921600

; Build flags for ESP32-C6 & optimization
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_WAVESHARE_ESP32_C6_LCD_147=1

; Flash & partition settings (4MB/8MB Flash)
board_build.flash_mode = dio
board_build.partitions = default.csv
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L

lib_deps =
    ; Uses ESP32 Arduino Core built-in BLE, SPI, Preferences, and LEDC
