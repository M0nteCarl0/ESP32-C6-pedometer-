name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish as a release (leave empty to only build artifacts)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: ESP32 firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('esp32_firmware/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade platformio

      - name: Build firmware
        working-directory: esp32_firmware
        run: pio run

      - name: Stage firmware images
        working-directory: esp32_firmware
        run: |
          set -euo pipefail
          BUILD_DIR=.pio/build/esp32-c6-lcd-147
          mkdir -p dist
          cp "$BUILD_DIR/firmware.bin"      dist/esp32-c6-pedometer-firmware.bin
          cp "$BUILD_DIR/bootloader.bin"    dist/esp32-c6-pedometer-bootloader.bin
          cp "$BUILD_DIR/partitions.bin"    dist/esp32-c6-pedometer-partitions.bin
          if [ -f "$BUILD_DIR/firmware.factory.bin" ]; then
            cp "$BUILD_DIR/firmware.factory.bin" dist/esp32-c6-pedometer-factory.bin
          else
            # Fallback: merge bootloader + partition table + app for a single 0x0 flash
            python -m esptool --chip esp32c6 merge_bin \
              -o dist/esp32-c6-pedometer-factory.bin \
              --flash_mode dio --flash_freq 80m --flash_size 4MB \
              0x0 "$BUILD_DIR/bootloader.bin" \
              0x8000 "$BUILD_DIR/partitions.bin" \
              0x10000 "$BUILD_DIR/firmware.bin"
          fi
          ls -l dist

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: esp32_firmware/dist/*
          if-no-files-found: error

  android:
    name: Android app (Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android_native_app/gradlew

      - name: Build debug APK
        working-directory: android_native_app
        # gradle.properties pins a Windows JDK path for local builds; the CLI
        # system property takes precedence and points the build at the CI JDK.
        run: ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" assembleDebug

      - name: Stage APK
        working-directory: android_native_app
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/esp32-pedometer-sync-debug.apk
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android_native_app/dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [firmware, android]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -l release-assets

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
