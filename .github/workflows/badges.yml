name: Badges

# GitHub only exposes clone statistics through the repository traffic API, which
# needs a token with push access and a 14-day window, and resets over time.
# This workflow snapshots that number into badges/clones.json on the "badges"
# branch so shields.io can render it as a dynamic JSON badge in the README.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  clones:
    name: Refresh clone statistics
    runs-on: ubuntu-latest
    steps:
      - name: Collect clone statistics
        env:
          # GITHUB_TOKEN is normally enough because the job has contents: write;
          # set a TRAFFIC_TOKEN secret (fine-grained PAT with Administration:
          # read) if the default token is rejected by the traffic API.
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out
          gh api "repos/${GITHUB_REPOSITORY}/traffic/clones" > out/clones-api.json
          python3 - <<'PY'
          import datetime
          import json
          import pathlib

          raw = json.loads(pathlib.Path("out/clones-api.json").read_text())
          days = [d for d in raw.get("clones", []) if d.get("count", 0) > 0]
          payload = {
              "count": raw.get("count", 0),
              "uniques": raw.get("uniques", 0),
              "window_days": len(raw.get("clones", [])),
              "days_with_clones": len(days),
              "updated": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          pathlib.Path("out/clones.json").write_text(json.dumps(payload, indent=2) + "\n")
          print(json.dumps(payload))
          PY

      - name: Publish clones.json to the badges branch
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          content=$(base64 -w0 out/clones.json)
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/clones.json?ref=badges" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/clones.json" \
              -f message="Update clone statistics" \
              -f content="$content" \
              -f sha="$sha" \
              -f branch=badges > /dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/clones.json" \
              -f message="Update clone statistics" \
              -f content="$content" \
              -f branch=badges > /dev/null
          fi
          echo "Published out/clones.json to the badges branch"
